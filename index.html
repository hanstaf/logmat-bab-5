<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logika Predikat · Bab V</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --bg:#17110c; --bg-2:#1e1610; --card:#241b14;
    --line:#3a2d20; --line-soft:#2d2318;
    --ink:#f0e6d8; --ink-2:#e0d3c1;
    --muted:#a89480; --muted-2:#7f7060;
    --latte:#c9945c; --latte-2:#e6c298; --latte-3:#a87d4a;
    --sage:#9fb48a; --sage-2:#b8c9a4;
    --terra:#c97b5e; --terra-2:#d99a7e;
  }
  html,body{margin:0;padding:0}
  body{
    font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 520px at 12% -10%, rgba(212,168,120,.08), transparent 60%),
      radial-gradient(900px 520px at 88% -10%, rgba(200,140,90,.06), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    min-height:100vh;
    display:flex;justify-content:center;
    padding:18px 14px 32px;
    -webkit-tap-highlight-color:transparent;
  }
  main{width:100%;max-width:860px}

  .page-header{
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    margin:0 0 12px;
  }
  h1{
    margin:0;
    font-family:'Fraunces',Georgia,serif;
    font-weight:600;
    font-size:clamp(22px,3.6vw,27px);
    letter-spacing:-.01em;
    color:var(--ink);
  }
  .chip{
    font-size:10.5px;letter-spacing:.14em;font-weight:600;
    color:var(--latte-2);
    background:rgba(201,148,92,.08);
    border:1px solid rgba(201,148,92,.25);
    padding:4px 9px;border-radius:999px;
  }

  /* HUD */
  .hud{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:linear-gradient(180deg,var(--card),var(--bg-2));
    border:1px solid var(--line);border-radius:12px;
    padding:8px 12px;margin-bottom:12px;
    font-size:13px;
  }
  .hud .hearts{display:flex;gap:3px;font-size:17px;line-height:1;color:var(--terra-2)}
  .hud .heart{transition:.3s}
  .hud .heart.lost{opacity:.22;color:var(--muted-2)}
  .hud .sep{width:1px;height:18px;background:var(--line);flex:0 0 auto}
  .hud .progress-wrap{flex:1;min-width:130px;display:flex;flex-direction:column;gap:4px}
  .hud .progress-label{
    font-size:10.5px;letter-spacing:.14em;color:var(--muted);font-weight:500;
    display:flex;justify-content:space-between;
  }
  .hud .progress-label b{color:var(--ink);font-weight:600}
  .hud .bar{height:4px;border-radius:999px;background:rgba(255,255,255,.04);overflow:hidden;border:1px solid var(--line-soft)}
  .hud .fill{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--latte-3),var(--latte-2));transition:width .12s linear}
  .hud .score{display:flex;align-items:center;gap:6px;font-weight:600}
  .hud .score .lbl{color:var(--muted);font-size:10.5px;letter-spacing:.14em}
  .hud .score .val{color:var(--latte-2);font-variant-numeric:tabular-nums}

  /* STAGE */
  #stage{
    position:relative;border-radius:16px;overflow:hidden;
    border:1px solid var(--line);
    background:#120d09;
    box-shadow:0 18px 40px rgba(0,0,0,.4);
  }
  canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:none}
  body.shake{animation:shk .45s}
  @keyframes shk{
    15%,85%{transform:translateX(-2px)}
    30%,70%{transform:translateX(2px)}
    45%,60%{transform:translateX(-3px)}
    55%{transform:translateX(3px)}
  }

  /* OVERLAY */
  .overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:14px;
    background:rgba(15,10,6,.82);
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
    transition:opacity .26s ease;
    z-index:5;
  }
  .overlay[hidden]{display:none}
  .panel{
    background:linear-gradient(180deg,#281f17,#1e1710);
    border:1px solid var(--line);border-radius:16px;
    padding:20px 22px;max-width:520px;width:100%;
    max-height:100%;overflow:auto;
    box-shadow:0 20px 44px rgba(0,0,0,.45);
    animation:fadeUp .3s cubic-bezier(.2,1,.4,1) both;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .panel h2{
    margin:0 0 10px;
    font-family:'Fraunces',Georgia,serif;
    font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.3;
    color:var(--ink);
  }
  .panel p{margin:8px 0;font-size:14px;line-height:1.55;color:var(--ink-2)}

  /* HERO (start/intro) */
  .panel-hero{text-align:center;padding:26px 20px 22px}
  .hero-icon{
    font-size:44px;line-height:1;
    margin-bottom:10px;
    filter:drop-shadow(0 6px 18px rgba(201,148,92,.25));
  }
  .hero-title{
    margin:0 0 6px;
    font-family:'Fraunces',Georgia,serif;
    font-size:22px;font-weight:600;
  }
  .hero-sub{margin:0 0 16px;color:var(--muted);font-size:13.5px}
  .hero-sub b{color:var(--latte-2);font-weight:600}

  /* QUIZ */
  .qnum{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:600;margin:0 0 8px}
  .qtext{
    font-family:'Fraunces',Georgia,serif;
    font-size:16px;font-weight:500;line-height:1.5;
    margin:0 0 12px;color:var(--ink);
  }
  .opts{display:grid;gap:7px;margin:10px 0 6px}
  .opt{
    display:flex;gap:10px;align-items:flex-start;text-align:left;
    padding:10px 12px;border-radius:10px;
    border:1px solid var(--line);background:rgba(42,32,24,.55);color:var(--ink);
    font:inherit;font-size:13.5px;line-height:1.45;cursor:pointer;
    transition:.15s;
  }
  .opt:hover:not(:disabled){border-color:rgba(201,148,92,.5);background:rgba(58,45,32,.7)}
  .opt:disabled{cursor:default}
  .opt kbd{
    flex:0 0 22px;height:22px;border-radius:6px;
    background:rgba(30,23,16,.9);border:1px solid var(--line);color:var(--latte-2);
    display:grid;place-items:center;font-family:'JetBrains Mono',monospace;
    font-size:10.5px;font-weight:500;
  }
  .opt .t{flex:1}
  .opt.right{border-color:var(--sage);background:rgba(159,180,138,.10)}
  .opt.right kbd{background:var(--sage);color:#1a2410;border-color:var(--sage)}
  .opt.wrong{border-color:var(--terra);background:rgba(201,123,94,.12)}
  .opt.wrong kbd{background:var(--terra);color:#2b0e06;border-color:var(--terra)}

  .feedback{margin:12px 0 0;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.5}
  .feedback[hidden]{display:none}
  .feedback.good{background:rgba(159,180,138,.07);border:1px solid rgba(159,180,138,.28)}
  .feedback.bad{background:rgba(201,123,94,.07);border:1px solid rgba(201,123,94,.28)}
  .fb-title{font-weight:600;font-size:13.5px;margin-bottom:3px}
  .feedback.good .fb-title{color:var(--sage-2)}
  .feedback.bad .fb-title{color:var(--terra-2)}
  .fb-text{color:var(--ink-2);font-size:13px}
  .fb-text b{color:var(--latte-2)}

  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:0;border-radius:10px;padding:10px 18px;
    font:inherit;font-weight:600;font-size:13.5px;
    cursor:pointer;transition:.15s;
  }
  .btn.primary{
    color:#1a120a;
    background:linear-gradient(180deg,var(--latte-2),var(--latte));
    box-shadow:0 6px 16px rgba(201,148,92,.20);
  }
  .btn.primary:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(201,148,92,.28)}
  .btn.ghost{background:rgba(255,255,255,.03);border:1px solid var(--line);color:var(--ink)}
  .btn.ghost:hover{border-color:rgba(201,148,92,.4);background:rgba(201,148,92,.05)}
  .btn.icon{
    padding:10px 14px;font-size:15px;line-height:1;min-width:44px;
  }
  .btn-lg{padding:12px 24px;font-size:14.5px}

  /* TIMER */
  .timer-wrap{margin:0 0 10px;padding:8px 10px;background:rgba(201,148,92,.05);border:1px solid var(--line-soft);border-radius:9px}
  .timer-top{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:5px}
  .timer-num{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--latte-2);font-weight:600;font-size:13px}
  .timer-track{height:4px;border-radius:2px;background:rgba(255,255,255,.05);overflow:hidden}
  .timer-fill{height:100%;width:100%;background:linear-gradient(90deg,var(--latte-3),var(--latte-2));border-radius:2px;transition:width .1s linear}
  .timer-fill.warning{background:linear-gradient(90deg,var(--terra-2),var(--terra));animation:pulseWarn 1s ease-in-out infinite}
  @keyframes pulseWarn{0%,100%{opacity:1}50%{opacity:.55}}

  /* END SCREEN */
  .end{text-align:center;padding:24px 20px}
  .end .emoji{font-size:52px;line-height:1;animation:pop .5s cubic-bezier(.2,1.3,.4,1) both}
  @keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  .end h2{margin:10px 0 14px;font-size:clamp(19px,4vw,24px)}
  .stats{display:flex;justify-content:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .stat{
    min-width:74px;padding:9px 12px;border-radius:10px;
    background:rgba(255,255,255,.02);border:1px solid var(--line);
    display:flex;flex-direction:column;gap:2px;align-items:center;
  }
  .stat .n{font-size:17px;font-weight:600;color:var(--latte-2);font-variant-numeric:tabular-nums}
  .stat .l{font-size:10px;letter-spacing:.14em;font-weight:500;color:var(--muted)}
  .end-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}

  /* TOUCH PAD */
  .pad{display:none;justify-content:center;gap:10px;margin-top:12px}
  .pad.show{display:flex}
  .pad button{
    width:86px;height:46px;border-radius:10px;
    border:1px solid var(--line);background:linear-gradient(180deg,#261e16,#1e1710);
    color:var(--ink-2);font-size:16px;font-weight:600;
    touch-action:none;user-select:none;cursor:pointer;
    transition:.12s;
  }
  .pad button:active,.pad button.on{background:var(--latte);color:#1a120a;border-color:var(--latte);transform:scale(.97)}

  /* FOOTER */
  .credit{
    display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
    margin-top:20px;font-size:12.5px;color:var(--muted);
  }
  .credit strong{color:var(--ink-2);font-weight:500}
  .ig{
    display:inline-flex;align-items:center;gap:6px;
    color:var(--latte-2);text-decoration:none;
    border:1px solid rgba(201,148,92,.22);background:rgba(201,148,92,.05);
    padding:5px 11px;border-radius:999px;font-size:12px;font-weight:500;
    transition:.15s;
  }
  .ig:hover{background:rgba(201,148,92,.12);border-color:rgba(201,148,92,.45)}

  @media (max-width:520px){
    body{padding:14px 10px 24px}
    .panel{padding:16px 16px;border-radius:14px}
    .qtext{font-size:15px}
    .opt{font-size:13px;padding:9px 10px}
    .pad button{width:70px;height:44px}
    .hud{font-size:12px;gap:10px;padding:7px 10px}
    .hud .hearts{font-size:15px}
    .end-actions .btn, .actions .btn{flex:1;min-width:0;padding:10px 12px;font-size:13px}
    .btn.icon{flex:0 0 auto;min-width:44px}
  }
</style>
</head>
<body>
<main>
  <header class="page-header">
    <h1>Logika Predikat</h1>
    <span class="chip">BAB V</span>
  </header>

  <div class="hud" id="hud" style="display:none">
    <div class="hearts" id="lives"></div>
    <div class="sep" id="hudSep"></div>
    <div class="progress-wrap">
      <div class="progress-label">
        <span id="progressLabel">SOAL</span>
        <span><b id="gateNum">1</b> / <span id="gateTotal">5</span></span>
      </div>
      <div class="bar"><div class="fill" id="gateFill"></div></div>
    </div>
    <div class="sep"></div>
    <div class="score"><span class="lbl">SKOR</span><span class="val" id="score">0</span></div>
  </div>

  <div id="stage">
    <canvas id="game" width="800" height="450"></canvas>

    <div class="overlay" id="overlay" hidden>
      <!-- START -->
      <section class="panel panel-hero" id="panelStart">
        <div class="hero-icon">🎯</div>
        <h2 class="hero-title">Siap mulai?</h2>
        <p class="hero-sub"></p>
        <div class="actions" style="justify-content:center">
          <button type="button" class="btn primary btn-lg" id="btnStart">Mulai ▶</button>
        </div>
      </section>

      <!-- QUIZ -->
      <section class="panel" id="panelQuiz" hidden>
        <p class="qnum" id="qNum">1 / 5</p>
        <div class="timer-wrap" id="timerWrap" hidden>
          <div class="timer-top">
            <span>⏱</span><span>Sisa waktu</span>
            <span class="timer-num" id="timerNum">60</span>
          </div>
          <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
        </div>
        <p class="qtext" id="qText"></p>
        <div class="opts" id="qOpts"></div>
        <div class="feedback" id="feedback" hidden></div>
        <div class="actions">
          <button type="button" class="btn primary" id="btnNext" hidden>Lanjut →</button>
        </div>
      </section>

      <!-- L1 DONE -->
      <section class="panel end" id="panelL1Done" hidden>
        <div class="emoji" id="l1Emoji">🎉</div>
        <h2 id="l1Title">Selesai!</h2>
        <div class="stats" id="l1Stats"></div>
        <div class="end-actions">
          <button type="button" class="btn ghost icon" id="btnL1Retry" title="Ulangi" aria-label="Ulangi">↻</button>
          <button type="button" class="btn ghost icon" id="btnL1Back" title="Menu" aria-label="Menu">⌂</button>
          <button type="button" class="btn primary" id="btnL1Continue">Lanjut →</button>
        </div>
      </section>

      <!-- L2 INTRO -->
      <section class="panel panel-hero" id="panelL2Intro" hidden>
        <div class="hero-icon">🦠</div>
        <h2 class="hero-title">Menghindar Dari Pengejaran Virus</h2>
        <p class="hero-sub"><b>60 detik</b> per gerbang • <b>12</b> gerbang</p>
        <div class="actions" style="justify-content:center">
          <button type="button" class="btn ghost icon" id="btnL2Back" title="Kembali" aria-label="Kembali">←</button>
          <button type="button" class="btn primary btn-lg" id="btnL2Start">Mulai ▶</button>
        </div>
      </section>

      <!-- L2 END -->
      <section class="panel end" id="panelL2End" hidden>
        <div class="emoji" id="endEmoji">🏆</div>
        <h2 id="endTitle"></h2>
        <div class="stats" id="endStats"></div>
        <div class="end-actions">
          <button type="button" class="btn ghost icon" id="btnBackMenu" title="Menu" aria-label="Menu">⌂</button>
          <button type="button" class="btn primary" id="btnRestart">Main Lagi ↻</button>
        </div>
      </section>
    </div>
  </div>

  <div class="pad" id="pad" aria-label="Kontrol sentuh">
    <button type="button" data-k="up" aria-label="Naik">▲</button>
    <button type="button" data-k="down" aria-label="Turun">▼</button>
  </div>

  <footer class="credit">
    <span>Dibuat oleh <strong>Hans Gunawan Tafonao</strong></span>
    <a class="ig" href="https://www.instagram.com/hans_taf?knvt=MWVuZmo5MWlycDViZQ==" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
        <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="12" cy="12" r="4.3" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="17.4" cy="6.6" r="1.4" fill="currentColor"/>
      </svg>
      <span>@hans_taf</span>
    </a>
  </footer>
</main>

<script>
(() => {
'use strict';

/* ========== KONFIGURASI ========== */
const W = 800, H = 450, PX = 160;
const BASE_SPEED   = 170;
const GATE_GAP     = 1300;
const GATE_VISIBLE = 700;
const INIT_GAP     = 120;
const MIN_GAP      = 45;
const CATCH_RATE   = 7;
const MAX_LIVES    = 3;
const QUIZ_BONUS   = 100;
const QUIZ_TIME    = 60;

/* ========== SOAL TAHAP 1 (Evaluasi V.1–V.5) ========== */
const L1_QUESTIONS = [
  {
    q: 'Manakah pernyataan yang tepat tentang proposisi dan predikat?',
    o: [
      'Proposisi mengandung variabel, predikat tidak',
      'Proposisi sudah pasti bernilai benar atau salah, predikat baru bisa dinilai setelah variabelnya diisi',
      'Proposisi dan predikat sama saja',
      'Proposisi selalu benar, predikat selalu salah'
    ],
    a: 1,
    why: 'Proposisi seperti "2 + 3 = 5" sudah pasti benar/salah. Predikat seperti "x > 3" baru bisa dinilai setelah x diganti.'
  },
  {
    q: 'P(x): x mod 3 = 0 pada D = {1, 2, …, 10}. Tentukan Tₚ.',
    o: ['{3, 6, 9}', '{1, 2, 4, 5, 7, 8, 10}', '{0, 3, 6, 9}', '{3, 9}'],
    a: 0,
    why: 'Bilangan di D yang habis dibagi 3 adalah 3, 6, dan 9.'
  },
  {
    q: 'Mengapa tabel dapat dipandang sebagai himpunan kebenaran suatu predikat?',
    o: [
      'Karena tabel selalu berisi angka',
      'Karena setiap baris (tupel) adalah data yang memenuhi predikat dari kolom (atribut)',
      'Karena tabel hanya punya satu kolom',
      'Karena tabel selalu memiliki kunci utama'
    ],
    a: 1,
    why: 'Dalam model relasional Codd (1970), setiap baris adalah tupel yang memenuhi predikat dari kolom-kolomnya.'
  },
  {
    q: 'Pada D = {−2, −1, 0, 1, 2, 3, 4}, tentukan Tₚ dari (x > 0) and (x mod 2 = 0).',
    o: ['{2, 4}', '{0, 2, 4}', '{1, 3}', '{−2, −1, 0}'],
    a: 0,
    why: 'x harus positif sekaligus genap — hanya 2 dan 4 yang memenuhi.'
  },
  {
    q: 'P(x): x bilangan genap dan x < 7 pada D = {1, …, 10}. Tentukan Tₚ.',
    o: ['{2, 4, 6}', '{2, 4, 6, 8}', '{1, 3, 5}', '{7, 8, 9, 10}'],
    a: 0,
    why: 'Bilangan genap di D yang kurang dari 7 adalah 2, 4, dan 6.'
  }
];

/* ========== SOAL TAHAP 2 (pendalaman) ========== */
const L2_QUESTIONS = [
  { q:'P(x): x > 2 dengan D = {1, 2, 3, 4}. Tentukan Tₚ.',
    o:['{1, 2}','{3, 4}','{2, 3, 4}','{1, 2, 3, 4}'], a:1,
    why:'Yang memenuhi x > 2 hanya 3 dan 4.' },
  { q:'Negasi dari ∀x P(x) adalah …',
    o:['∀x ¬P(x)','∃x ¬P(x)','∃x P(x)','¬∃x ¬P(x)'], a:1,
    why:'¬∀x P(x) ≡ ∃x ¬P(x).' },
  { q:'Negasi dari ∃x P(x) adalah …',
    o:['∃x ¬P(x)','∀x ¬P(x)','∀x P(x)','¬∀x ¬P(x)'], a:1,
    why:'¬∃x P(x) ≡ ∀x ¬P(x).' },
  { q:'D = {0, 1, 2}, P(x): x² < 2. Tentukan Tₚ.',
    o:['{0}','{0, 1}','{1, 2}','{0, 1, 2}'], a:1,
    why:'0² = 0 dan 1² = 1 memenuhi. 2² = 4 tidak.' },
  { q:'Pada D = ℤ, P(x): x² < 10. Tentukan Tₚ.',
    o:['{−3, …, 3}','{−10, …, 10}','{0, 1, 2, 3}','{−4, …, 4}'], a:0,
    why:'3² = 9 < 10, tetapi 4² = 16 tidak.' },
  { q:'Implikasi P → Q ekuivalen dengan …',
    o:['P ∧ Q','¬P ∨ Q','¬P ∧ Q','P ∨ ¬Q'], a:1,
    why:'P → Q salah hanya ketika P benar dan Q salah. ¬P ∨ Q juga demikian.' },
  { q:'Bikondisional P ↔ Q benar tepat ketika …',
    o:['P dan Q keduanya benar','P dan Q memiliki nilai kebenaran sama','P benar dan Q salah','salah satu benar'], a:1,
    why:'Benar jika keduanya benar atau keduanya salah.' },
  { q:'Arti notasi Hoare {P} C {Q} adalah …',
    o:['Q pasti benar sebelum C dijalankan','jika P benar sebelum C dijalankan dan C berhenti, maka Q benar sesudahnya','C selalu berhenti dan P selalu salah','P dan Q harus bernilai sama'], a:1,
    why:'P adalah kondisi awal dan Q adalah kondisi akhir program C.' },
  { q:'Kenapa (x > 0) and (x mod 2 = 0) di Pascal perlu tanda kurung?',
    o:['operator and berprioritas lebih tinggi daripada operator perbandingan','and hanya bisa dipakai pada bilangan bulat','Pascal tidak mengenal mod','tanda kurung wajib di setiap if'], a:0,
    why:'Tanpa kurung, urutan operasinya berbeda dan hasilnya bisa salah.' },
  { q:'Dalam model relasional Codd (1970), setiap baris disebut …',
    o:['atribut','tupel','domain','kunci'], a:1,
    why:'Tabel dipandang sebagai relasi — himpunan tupel. Baris = tupel.' },
  { q:'A = {1, 2, 3}, R = {(1,1), (2,2), (3,3), (1,2)}. R bersifat …',
    o:['refleksif dan transitif','refleksif dan simetris','simetris dan transitif','ekuivalensi'], a:0,
    why:'Refleksif karena (a, a) ∈ R. Tidak simetris karena (2, 1) ∉ R.' },
  { q:'Nilai kebenaran ∃x ∈ {1, 2, 3}: x² = 4 adalah …',
    o:['benar, karena x = 2 memenuhi','salah, tidak ada x yang memenuhi','benar hanya jika x = 1','tidak dapat ditentukan'], a:0,
    why:'Satu contoh cukup untuk ∃. Di sini x = 2 dan 2² = 4.' }
];

/* ========== ELEMEN ========== */
const $ = id => document.getElementById(id);
const cvs = $('game'), ctx = cvs.getContext('2d');
const overlay = $('overlay');
const hud = $('hud');
const pad = $('pad');
const panels = {
  start:   $('panelStart'),
  quiz:    $('panelQuiz'),
  l1Done:  $('panelL1Done'),
  l2Intro: $('panelL2Intro'),
  l2End:   $('panelL2End')
};

/* ========== STATE ========== */
const keys = { up:false, down:false };

let state = 'menu';
let P = null;
let virus = null;
let particles = [];
let shake = 0;
let flashRed = 0;
let anim = null;
let pendingHTML = '';
let lastCorrect = false;
let pendingTimer = 0;
let deck = [];
let answered = 0;
let correctN = 0;
let quizPoints = 0;
let nextGateX = 0;
let locked = true;
let curQ = null;
let curOpts = null;
let lastT = 0;

let l1Index = 0;
let l1Correct = 0;
let l1CurQ = null;
let l1CurOpts = null;

let quizTimer = 0;

// HUD cache
const hudCache = {
  hidden: null, isL1: null, lives: -1,
  gateNum: -1, gateTotal: -1, progress: -1, score: -1
};

/* ========== UTIL ========== */
const rnd = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const easeOutCubic = p => 1 - Math.pow(1-p, 3);
const easeInCubic = p => p*p*p;

function shuffle(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* ========== PANEL ========== */
function showPanel(name){
  overlay.hidden = false;
  for (const k in panels) panels[k].hidden = (k !== name);
}
function hideOverlay(){
  overlay.hidden = true;
  for (const k in panels) panels[k].hidden = true;
}

/* ========== RESET ========== */
function resetL2(){
  P = {
    y: H/2, worldX: 0, speed: BASE_SPEED,
    boostTime: 0, lives: MAX_LIVES, invul: 0,
    dist: 0, knockback: 0
  };
  virus = { y: H/2, gap: INIT_GAP, pulse: 0 };
  particles = [];
  shake = 0;
  flashRed = 0;
  anim = null;
  pendingHTML = '';
  pendingTimer = 0;
  deck = shuffle(L2_QUESTIONS);
  answered = 0;
  correctN = 0;
  quizPoints = 0;
  nextGateX = GATE_GAP;
  locked = true;
  curQ = null;
  curOpts = null;
  quizTimer = 0;
}

function resetAll(){
  resetL2();
  l1Index = 0;
  l1Correct = 0;
  l1CurQ = null;
  l1CurOpts = null;
  state = 'menu';
}

/* ========== START ========== */
function startLevel1(){
  resetL2();
  l1Index = 0;
  l1Correct = 0;
  state = 'l1-quiz';
  locked = false;
  for (const k in keys) keys[k] = false;
  showL1Question();
}

function startLevel2(){
  resetL2();
  state = 'l2-run';
  locked = false;
  hideOverlay();
  for (const k in keys) keys[k] = false;
}

/* ========== LEVEL 1 ========== */
function showL1Question(){
  if (l1Index >= L1_QUESTIONS.length){ finishLevel1(); return; }
  l1CurQ = L1_QUESTIONS[l1Index];
  l1CurOpts = shuffle(l1CurQ.o.map((t,i)=>({ t, ok:i===l1CurQ.a })));

  $('qNum').textContent = (l1Index+1) + ' / ' + L1_QUESTIONS.length;
  $('timerWrap').hidden = true;
  $('qText').textContent = l1CurQ.q;

  buildOptions(l1CurOpts, i => chooseL1Answer(i));
  clearFeedback();
  locked = false;
  showPanel('quiz');
}

function chooseL1Answer(i){
  if (state !== 'l1-quiz' || locked) return;
  locked = true;
  const correct = l1CurOpts[i].ok;
  lastCorrect = correct;
  if (correct) l1Correct++;
  markAnswer(i, l1CurOpts);

  pendingHTML = correct
    ? '<div class="fb-title">✓ Benar</div><div class="fb-text">' + l1CurQ.why + '</div>'
    : '<div class="fb-title">✗ Belum tepat</div><div class="fb-text"><b>Jawaban:</b> ' + l1CurOpts.find(o=>o.ok).t + '<br>' + l1CurQ.why + '</div>';

  state = 'l1-fb';
  showFeedbackInline('l1');
  updateHud();
}

function finishLevel1(){
  state = 'l1-done';
  const total = L1_QUESTIONS.length;
  const perfect = l1Correct === total;
  $('l1Emoji').textContent = perfect ? '🏆' : '🎉';
  $('l1Title').textContent = perfect ? 'Sempurna!' : 'Selesai!';
  $('l1Stats').innerHTML =
    '<div class="stat"><span class="n">' + l1Correct + '</span><span class="l">BENAR</span></div>' +
    '<div class="stat"><span class="n">' + (total - l1Correct) + '</span><span class="l">SALAH</span></div>' +
    '<div class="stat"><span class="n">' + (l1Correct * 100) + '</span><span class="l">SKOR</span></div>';
  showPanel('l1Done');
  updateHud();
}

/* ========== LEVEL 2 ========== */
function updateL2(dt){
  const dir = (keys.down?1:0) - (keys.up?1:0);
  P.y = clamp(P.y + dir*240*dt, 55, H-55);

  let target = BASE_SPEED;
  if (P.boostTime > 0){
    P.boostTime -= dt;
    target = BASE_SPEED * 1.35;
  }
  P.speed += (target - P.speed) * Math.min(1, dt*7);
  P.worldX += P.speed * dt;
  P.dist   += P.speed * dt;

  virus.y += (P.y - virus.y) * Math.min(1, dt*4);
  virus.pulse += dt*3;
  if (state === 'l2-run'){
    virus.gap = Math.max(MIN_GAP, virus.gap - CATCH_RATE*dt);
  }

  if (state === 'l2-run' && P.worldX >= nextGateX){
    startL2Quiz();
  }

  if (P.invul > 0) P.invul -= dt;
  if (P.knockback > 0) P.knockback *= Math.pow(0.001, dt);
  if (P.knockback < 0.1) P.knockback = 0;
  if (shake > 0) shake = Math.max(0, shake - dt*60);
  if (flashRed > 0) flashRed = Math.max(0, flashRed - dt*2.5);

  if (state === 'l2-anim' && anim){
    anim.t += dt;
    updateAnim(dt);
    pendingTimer -= dt;
    if (pendingTimer <= 0){
      state = 'l2-fb';
      showFeedbackInline('l2');
    }
  }
}

function startBoostAnim(){
  anim = { type:'boost', t:0, fromGap:virus.gap, toGap:Math.min(INIT_GAP+40, virus.gap+90) };
  pendingTimer = 1.1;
  state = 'l2-anim';
  spawnBurst(PX - 20, P.y, ['#e6c298','#c9945c','#e0b884'], 16);
}
function startCrashAnim(){
  anim = { type:'crash', t:0, fromGap:virus.gap, impact:false };
  pendingTimer = 1.2;
  state = 'l2-anim';
}

function updateAnim(){
  const t = anim.t;
  if (anim.type === 'boost'){
    const p = Math.min(1, t/0.75);
    virus.gap = anim.fromGap + (anim.toGap - anim.fromGap)*easeOutCubic(p);
    if (Math.random() < 0.6) spawnTrail(PX - 22, P.y + rnd(-14,14));
  } else if (anim.type === 'crash'){
    if (t < 0.3){
      virus.gap = anim.fromGap * (1 - easeInCubic(t/0.3));
    } else if (t < 0.55){
      virus.gap = 0;
      if (!anim.impact){ anim.impact = true; triggerImpact(); }
    } else {
      const p = Math.min(1, (t - 0.55)/0.55);
      virus.gap = INIT_GAP * easeOutCubic(p);
    }
  }
}

function triggerImpact(){
  P.lives--;
  P.invul = 1.6;
  P.knockback = 22;
  shake = 15;
  flashRed = 1;
  document.body.classList.add('shake');
  setTimeout(() => document.body.classList.remove('shake'), 460);
  spawnBurst(PX, P.y, ['#c97b5e','#d99a7e','#e0b884'], 22);
  updateHud();
}

/* ========== PARTIKEL ========== */
function updateParticles(dt){
  for (let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0){ particles.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= 0.96; p.vy *= 0.96;
    p.vy += p.grav*dt;
  }
}
function spawnTrail(x,y){
  particles.push({
    x, y, vx: rnd(-200,-110), vy: rnd(-30,30),
    life: rnd(0.35,0.6), maxLife: 0.6,
    color: Math.random()<0.5 ? '#e6c298' : '#c9945c',
    size: rnd(2,3.5), grav: 0
  });
}
function spawnBurst(x,y,colors,count){
  for (let i=0;i<count;i++){
    const ang = rnd(0,Math.PI*2), sp = rnd(100,320);
    particles.push({
      x: x + rnd(-6,6), y: y + rnd(-6,6),
      vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp,
      life: rnd(0.4,0.9), maxLife: 0.9,
      color: colors[i % colors.length],
      size: rnd(2,4), grav: 220
    });
  }
}

/* ========== L2 QUIZ ========== */
function startL2Quiz(){
  state = 'l2-quiz';
  locked = false;
  quizTimer = QUIZ_TIME;
  for (const k in keys) keys[k] = false;

  curQ = deck[answered];
  $('qNum').textContent = (answered+1) + ' / ' + deck.length;
  $('qText').textContent = curQ.q;

  curOpts = shuffle(curQ.o.map((t,i)=>({ t, ok:i===curQ.a })));
  buildOptions(curOpts, i => chooseL2Answer(i));

  $('timerWrap').hidden = false;
  updateTimerDisplay();
  clearFeedback();
  showPanel('quiz');
}

function chooseL2Answer(i){
  if (state !== 'l2-quiz' || locked) return;
  locked = true;
  for (const k in keys) keys[k] = false;
  const correct = curOpts[i].ok;
  lastCorrect = correct;
  markAnswer(i, curOpts);

  if (correct){
    quizPoints += QUIZ_BONUS;
    correctN++;
    pendingHTML = '<div class="fb-title">✓ Benar +' + QUIZ_BONUS + '</div><div class="fb-text">' + curQ.why + '</div>';
    startBoostAnim();
  } else {
    pendingHTML = '<div class="fb-title">✗ Salah −1 nyawa</div><div class="fb-text"><b>Jawaban:</b> ' + curOpts.find(o=>o.ok).t + '<br>' + curQ.why + '</div>';
    startCrashAnim();
  }
  answered++;
  updateHud();
  hideOverlay();
}

function handleTimeout(){
  if (state !== 'l2-quiz' || locked) return;
  locked = true;
  lastCorrect = false;
  markAnswer(-1, curOpts);

  P.lives--;
  P.invul = 1.6;
  P.knockback = 22;
  shake = 15;
  flashRed = 1;
  document.body.classList.add('shake');
  setTimeout(() => document.body.classList.remove('shake'), 460);
  spawnBurst(PX, P.y, ['#c97b5e','#d99a7e','#e0b884'], 18);
  updateHud();

  pendingHTML = '<div class="fb-title">⏱ Waktu habis −1 nyawa</div><div class="fb-text"><b>Jawaban:</b> ' + curOpts.find(o=>o.ok).t + '<br>' + curQ.why + '</div>';
  answered++;
  state = 'l2-fb';
  showFeedbackInline('l2');
}

function updateTimerDisplay(){
  const pct = (quizTimer / QUIZ_TIME) * 100;
  $('timerFill').style.width = pct + '%';
  $('timerNum').textContent = Math.ceil(quizTimer);
  $('timerFill').classList.toggle('warning', quizTimer < 15);
}

/* ========== SHARED QUIZ HELPERS ========== */
function buildOptions(opts, onClick){
  const box = $('qOpts');
  box.innerHTML = '';
  opts.forEach((o,i)=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    const k = document.createElement('kbd');
    k.textContent = 'ABCD'[i] || String(i+1);
    const s = document.createElement('span');
    s.className = 't';
    s.textContent = o.t;
    b.appendChild(k); b.appendChild(s);
    b.addEventListener('click', () => onClick(i));
    box.appendChild(b);
  });
}

function markAnswer(selected, opts){
  const btns = $('qOpts').children;
  for (let j=0;j<btns.length;j++){
    btns[j].disabled = true;
    if (opts[j].ok) btns[j].classList.add('right');
  }
  if (selected >= 0 && !opts[selected].ok){
    btns[selected].classList.add('wrong');
  }
}

function clearFeedback(){
  const fb = $('feedback');
  fb.hidden = true; fb.className = 'feedback'; fb.innerHTML = '';
  $('btnNext').hidden = true;
}

function showFeedbackInline(kind){
  showPanel('quiz');  // ensure overlay tampil lagi (fix bug)
  const fb = $('feedback');
  fb.innerHTML = pendingHTML;
  fb.className = 'feedback ' + (lastCorrect ? 'good' : 'bad');
  fb.hidden = false;

  const next = $('btnNext');
  if (kind === 'l1'){
    next.textContent = (l1Index + 1 >= L1_QUESTIONS.length) ? 'Selesai →' : 'Lanjut →';
    next.dataset.kind = 'l1';
  } else {
    if (P.lives <= 0) next.textContent = 'Lihat Hasil →';
    else if (answered >= deck.length) next.textContent = 'Selesai →';
    else next.textContent = 'Lanjut →';
    next.dataset.kind = 'l2';
  }
  next.hidden = false;
}

function onContinue(){
  const kind = $('btnNext').dataset.kind;
  if (kind === 'l1' && state === 'l1-fb'){
    l1Index++;
    if (l1Index >= L1_QUESTIONS.length){
      finishLevel1();
    } else {
      state = 'l1-quiz';
      locked = false;
      showL1Question();
    }
    return;
  }
  if (kind !== 'l2' || state !== 'l2-fb') return;

  if (P.lives <= 0){ state = 'l2-over'; showL2End(false); return; }
  if (answered >= deck.length){ state = 'l2-win'; showL2End(true); return; }

  virus.gap = INIT_GAP;
  P.boostTime = 0;
  nextGateX = P.worldX + GATE_GAP;
  for (const k in keys) keys[k] = false;
  locked = false;
  state = 'l2-run';
  hideOverlay();
}

/* ========== L2 END ========== */
function showL2End(win){
  $('endEmoji').textContent = win ? '🏆' : '💀';
  $('endTitle').textContent = win ? 'Menang!' : 'Virus menangkapmu';
  $('endStats').innerHTML =
    '<div class="stat"><span class="n">' + correctN + '</span><span class="l">BENAR</span></div>' +
    '<div class="stat"><span class="n">' + (answered - correctN) + '</span><span class="l">SALAH</span></div>' +
    '<div class="stat"><span class="n">' + l2Score() + '</span><span class="l">SKOR</span></div>';
  showPanel('l2End');
}

function l2Score(){ return Math.floor(P.dist/10) + quizPoints; }

/* ========== HUD (cached) ========== */
function updateHud(){
  const hiddenStates = ['menu', 'l1-done', 'l2-intro', 'l2-over', 'l2-win'];
  const isHidden = hiddenStates.indexOf(state) !== -1;

  if (isHidden){
    if (hudCache.hidden !== true){
      hud.style.display = 'none';
      hudCache.hidden = true;
    }
    return;
  }
  if (hudCache.hidden !== false){
    hud.style.display = '';
    hudCache.hidden = false;
    hudCache.isL1 = null; hudCache.lives = -1;
    hudCache.gateNum = -1; hudCache.gateTotal = -1;
    hudCache.progress = -1; hudCache.score = -1;
  }

  const isL1 = state.indexOf('l1-') === 0;
  if (hudCache.isL1 !== isL1){
    $('lives').style.display = isL1 ? 'none' : '';
    $('hudSep').style.display = isL1 ? 'none' : '';
    $('progressLabel').textContent = isL1 ? 'SOAL' : 'GERBANG';
    hudCache.isL1 = isL1;
    hudCache.lives = -1;
  }

  if (!isL1){
    const lives = P ? P.lives : MAX_LIVES;
    if (hudCache.lives !== lives){
      let html = '';
      for (let i=0;i<MAX_LIVES;i++){
        html += '<span class="heart' + (i >= lives ? ' lost' : '') + '">♥</span>';
      }
      $('lives').innerHTML = html;
      hudCache.lives = lives;
    }
  }

  let gateNum, gateTotal, progress, score;
  if (isL1){
    gateNum = Math.min(l1Index + 1, L1_QUESTIONS.length);
    gateTotal = L1_QUESTIONS.length;
    progress = (l1Index / L1_QUESTIONS.length) * 100;
    score = l1Correct * 100;
  } else {
    gateNum = Math.min(answered + 1, deck.length);
    gateTotal = deck.length;
    progress = (answered / Math.max(1, deck.length)) * 100;
    score = P ? l2Score() : 0;
  }

  if (hudCache.gateNum !== gateNum){ $('gateNum').textContent = gateNum; hudCache.gateNum = gateNum; }
  if (hudCache.gateTotal !== gateTotal){ $('gateTotal').textContent = gateTotal; hudCache.gateTotal = gateTotal; }
  if (Math.abs(hudCache.progress - progress) > 0.2){
    $('gateFill').style.width = progress.toFixed(1) + '%';
    hudCache.progress = progress;
  }
  if (hudCache.score !== score){ $('score').textContent = score; hudCache.score = score; }
}

/* ========== PAD ========== */
function updatePad(){
  const show = (state === 'l2-run' || state === 'l2-anim');
  pad.classList.toggle('show', show);
}

/* ========== DRAWING ========== */
function drawBackground(t){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, '#1c140e');
  g.addColorStop(0.6, '#231a12');
  g.addColorStop(1, '#1a120c');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  const glow = ctx.createRadialGradient(W*0.5, -100, 50, W*0.5, -100, 500);
  glow.addColorStop(0, 'rgba(230,194,152,0.08)');
  glow.addColorStop(1, 'rgba(230,194,152,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0,0,W,H);

  const inChase = state.indexOf('l2-') === 0 && state !== 'l2-intro';
  if (inChase && P){
    const scrollX = ((P.worldX*0.55) % 80 + 80) % 80;
    ctx.strokeStyle = 'rgba(230,194,152,0.045)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x=-scrollX; x<W+80; x+=80){ ctx.moveTo(x,0); ctx.lineTo(x,H); }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(201,148,92,0.035)';
    ctx.beginPath();
    for (let y=0; y<H; y+=60){ ctx.moveTo(0,y); ctx.lineTo(W,y); }
    ctx.stroke();
  } else {
    ctx.strokeStyle = 'rgba(201,148,92,0.03)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let y=40; y<H-30; y+=36){ ctx.moveTo(20, y); ctx.lineTo(W-20, y); }
    ctx.stroke();
  }

  ctx.fillStyle = 'rgba(201,148,92,0.06)';
  ctx.fillRect(0, H-34, W, 34);
  ctx.strokeStyle = 'rgba(201,148,92,0.30)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, H-34); ctx.lineTo(W, H-34);
  ctx.stroke();

  if (inChase && virus && virus.gap < 85){
    const intensity = 1 - virus.gap/85;
    const vg = ctx.createRadialGradient(W*0.5, H*0.5, H*0.25, W*0.5, H*0.5, H*0.75);
    vg.addColorStop(0, 'rgba(201,123,94,0)');
    vg.addColorStop(1, 'rgba(201,123,94,' + (intensity*0.30).toFixed(3) + ')');
    ctx.fillStyle = vg;
    ctx.fillRect(0,0,W,H);
  }
}

function drawGate(){
  if (!virus || !P) return;
  const dist = nextGateX - P.worldX;
  if (dist > GATE_VISIBLE || dist < -40) return;
  const gx = PX + dist;
  const pulse = 0.5 + 0.5*Math.sin(performance.now()/180);

  const grd = ctx.createLinearGradient(gx-100,0,gx+100,0);
  grd.addColorStop(0, 'rgba(230,194,152,0)');
  grd.addColorStop(0.5, 'rgba(230,194,152,' + (0.14 + 0.10*pulse).toFixed(3) + ')');
  grd.addColorStop(1, 'rgba(230,194,152,0)');
  ctx.fillStyle = grd;
  ctx.fillRect(gx-100, 0, 200, H);

  ctx.fillStyle = '#a87d4a';
  ctx.fillRect(gx-7, 0, 4, H);
  ctx.fillRect(gx+3, 0, 4, H);
  ctx.fillStyle = 'rgba(255,236,205,' + (0.7 + 0.3*pulse).toFixed(2) + ')';
  ctx.fillRect(gx-7, 0, 1.5, H);
  ctx.fillRect(gx+3, 0, 1.5, H);

  ctx.fillStyle = '#f5d9b0';
  ctx.beginPath();
  ctx.arc(gx, 24, 7 + pulse*2.5, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#f5e3c8';
  ctx.font = '600 11px Outfit, system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('KUIS', gx, 48);
}

function drawPlayer(t, running){
  if (!P) return;
  const x = PX - P.knockback;
  const y = running ? P.y : H/2 + Math.sin(t/520)*2.5;

  if (running && P.boostTime > 0){
    for (let i=0;i<5;i++){
      const a = (1 - i/5) * 0.45;
      ctx.globalAlpha = a;
      ctx.fillStyle = '#e6c298';
      ctx.beginPath();
      ctx.arc(x - 22 - i*10, y + Math.sin(t/60 + i)*3, 10 - i*1.4, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  if (running && P.invul > 0 && Math.floor(t/70) % 2 === 0) ctx.globalAlpha = 0.4;

  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(x, y+22, 16, 5, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.strokeStyle = '#a87d4a';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  if (running){
    const phase = (t/110) % 1;
    const swing = Math.sin(phase*Math.PI*2) * 7;
    ctx.beginPath();
    ctx.moveTo(x-4, y+8); ctx.lineTo(x-4-swing, y+22);
    ctx.moveTo(x+4, y+8); ctx.lineTo(x+4+swing, y+22);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(x-4, y+8); ctx.lineTo(x-4, y+22);
    ctx.moveTo(x+4, y+8); ctx.lineTo(x+4, y+22);
    ctx.stroke();
  }

  const bg = ctx.createRadialGradient(x-4, y-4, 2, x, y, 18);
  bg.addColorStop(0, '#f5d9b0');
  bg.addColorStop(1, '#c9945c');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.arc(x, y, 15, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#7a5230';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(x+5, y-4, 4.5, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#2a1a0e';
  ctx.beginPath();
  ctx.arc(running ? x+7 : x+6, y-4, 2.2, 0, Math.PI*2);
  ctx.fill();

  ctx.globalAlpha = 1;
}

function drawVirus(t){
  if (!virus) return;
  const x = PX - virus.gap;
  const y = virus.y;
  const pulse = 0.5 + 0.5*Math.sin(virus.pulse);

  const glow = ctx.createRadialGradient(x, y, 6, x, y, 52);
  glow.addColorStop(0, 'rgba(201,123,94,' + (0.25 + 0.15*pulse).toFixed(3) + ')');
  glow.addColorStop(1, 'rgba(201,123,94,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(x, y, 52, 0, Math.PI*2);
  ctx.fill();

  ctx.strokeStyle = '#8b3a24';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  for (let k=0;k<8;k++){
    const baseA = k*Math.PI/4;
    const wob = Math.sin(t/260 + k*1.7) * 0.35;
    const a = baseA + wob;
    const len = 16 + Math.sin(t/320 + k*2) * 4;
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a)*11, y + Math.sin(a)*11);
    ctx.lineTo(x + Math.cos(a)*len, y + Math.sin(a)*len);
    ctx.stroke();
  }

  const bg = ctx.createRadialGradient(x-5, y-5, 3, x, y, 18);
  bg.addColorStop(0, '#d99a7e');
  bg.addColorStop(1, '#8b3a24');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.arc(x, y, 16, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#3d1a0e';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = '#fef2e8';
  ctx.beginPath();
  ctx.arc(x-5, y-3, 4, 0, Math.PI*2);
  ctx.arc(x+5, y-3, 4, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#4d1a0e';
  ctx.beginPath();
  ctx.arc(x-4, y-2, 2, 0, Math.PI*2);
  ctx.arc(x+6, y-2, 2, 0, Math.PI*2);
  ctx.fill();

  ctx.strokeStyle = '#3d1a0e';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x-9, y-8); ctx.lineTo(x-2, y-6);
  ctx.moveTo(x+9, y-8); ctx.lineTo(x+2, y-6);
  ctx.stroke();

  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.arc(x, y+5, 4, 0.15*Math.PI, 0.85*Math.PI);
  ctx.stroke();
}

function drawParticles(){
  for (const p of particles){
    const a = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size*a, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function draw(t){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if (shake > 0){
    const dx = rnd(-shake, shake), dy = rnd(-shake, shake);
    ctx.translate(dx, dy);
  }

  drawBackground(t);

  const inChase = state.indexOf('l2-') === 0 && state !== 'l2-intro';
  if (inChase){
    drawGate();
    drawVirus(t);
    drawPlayer(t, true);
  } else {
    drawPlayer(t, false);
  }
  drawParticles();

  if (flashRed > 0){
    ctx.fillStyle = 'rgba(201,123,94,' + (flashRed*0.30).toFixed(3) + ')';
    ctx.fillRect(0,0,W,H);
  }
  ctx.restore();
}

/* ========== UPDATE ========== */
function update(dt){
  if (state === 'l2-run' || state === 'l2-anim') updateL2(dt);
  if (state === 'l2-quiz' && !locked){
    quizTimer -= dt;
    if (quizTimer <= 0){
      quizTimer = 0;
      handleTimeout();
    } else {
      updateTimerDisplay();
    }
  }
  // Partikel tetap di-update di semua state (fix bug freeze)
  if (particles.length) updateParticles(dt);
  if (shake > 0 && state.indexOf('l2-') !== 0) shake = Math.max(0, shake - dt*60);
  if (flashRed > 0 && state.indexOf('l2-') !== 0) flashRed = Math.max(0, flashRed - dt*2.5);
}

/* ========== INPUT ========== */
const MOVE = {
  ArrowUp:'up', w:'up', W:'up',
  ArrowDown:'down', s:'down', S:'down'
};
const PICK = { '1':0,'2':1,'3':2,'4':3, a:0,b:1,c:2,d:3, A:0,B:1,C:2,D:3 };

addEventListener('keydown', e => {
  if (state === 'l1-quiz' && !locked){
    if (Object.prototype.hasOwnProperty.call(PICK, e.key)){
      e.preventDefault();
      chooseL1Answer(PICK[e.key]);
    }
    return;
  }
  if (state === 'l2-quiz' && !locked){
    if (Object.prototype.hasOwnProperty.call(PICK, e.key)){
      e.preventDefault();
      chooseL2Answer(PICK[e.key]);
    }
    return;
  }
  if (state === 'l1-fb' || state === 'l2-fb'){
    if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      onContinue();
    }
    return;
  }
  if (state === 'menu'){
    if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); startLevel1(); }
    return;
  }
  if (state === 'l1-done'){
    if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); $('btnL1Continue').click(); }
    return;
  }
  if (state === 'l2-intro'){
    if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); startLevel2(); }
    return;
  }
  if (state === 'l2-over' || state === 'l2-win'){
    if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); startLevel2(); }
    return;
  }
  if (state === 'l2-run'){
    const k = MOVE[e.key];
    if (k){ e.preventDefault(); keys[k] = true; }
  }
});

addEventListener('keyup', e => {
  const k = MOVE[e.key];
  if (k) keys[k] = false;
});
addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
});

document.querySelectorAll('.pad button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => {
    if (state !== 'l2-run') return;
    e.preventDefault();
    keys[k] = true;
    b.classList.add('on');
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev =>
    b.addEventListener(ev, () => { keys[k] = false; b.classList.remove('on'); }));
});

/* ========== TOMBOL ========== */
$('btnStart').addEventListener('click', startLevel1);
$('btnNext').addEventListener('click', onContinue);

$('btnL1Retry').addEventListener('click', () => {
  l1Index = 0;
  l1Correct = 0;
  state = 'l1-quiz';
  locked = false;
  showL1Question();
});
$('btnL1Back').addEventListener('click', () => {
  resetAll();
  showPanel('start');
  updateHud();
});
$('btnL1Continue').addEventListener('click', () => {
  state = 'l2-intro';
  showPanel('l2Intro');
  updateHud();
});
$('btnL2Back').addEventListener('click', () => {
  state = 'l1-done';
  showPanel('l1Done');
  updateHud();
});
$('btnL2Start').addEventListener('click', startLevel2);
$('btnRestart').addEventListener('click', startLevel2);
$('btnBackMenu').addEventListener('click', () => {
  resetAll();
  showPanel('start');
  updateHud();
});

/* ========== LOOP ========== */
function frame(t){
  const dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000));
  lastT = t;
  update(dt);
  draw(t);
  updateHud();
  updatePad();
  requestAnimationFrame(frame);
}

/* ========== INIT ========== */
resetAll();
showPanel('start');
requestAnimationFrame(frame);

})();
</script>
